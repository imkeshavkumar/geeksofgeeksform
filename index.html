<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFG Login</title>
    <link
     rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="true"
    />
  </head>
  <body>
    <div id="wrapper">
      <div class="form_container">
        <h4>Please Login To Continue</h4>
        <div class="form_outline">
          <div class="form_input">
            <div class="bars">
              <div class="bar1">Sign In</div>
              <div class="bar2">Sign Up</div>
            </div>

            <form action="">
              <div class="username_password">
                <i class="fa-solid fa-circle-user"></i>
                <input
                  type="text"
                  placeholder="Username or email"
                  class="username_password_input"
                />
              </div>

              <div class="username_password">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="text"
                  placeholder="Password"
                  class="username_password_input"
                />
              </div>

              <div class="remember">
                <div class="re">
                  <div>
                    <input type="checkbox" />
                  </div>
                  <div>
                    <label for="checkbox" class="re">Remember me</label>
                  </div>
                </div>
                <div>
                  <label for="forgot" class="forgot">Forgot Password</label>
                </div>
              </div>

              <button class="sign_in">Sign In</button>

              <div class="social_media_sign">
                <div class="or">
                  <div>
                    <span>or</span>
                  </div>
                </div>

              
              </div>

              <div class="social_media_accounts">
                <div class="google">
                  <button>
                    <i class="fa-brands fa-google"></i>
                    <span>Google</span>
                  </button>
                </div>

                <div class="google">
                  <button>
                    <i class="fa-brands fa-google"></i>
                    <span>Google</span>
                  </button>
                </div>

                <div class="facebook">
                  <button>
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>Facebook</span>
                  </button>
                </div>

                <div class="google">
                  <button>
                    <i class="fa-brands fa-google"></i>
                    <span>Google</span>
                  </button>
                </div>

                
              </div>

              <div class="strong">
                <strong>Why Create an Account?</strong>
              </div>

              <div class="footer">
                By creating this account you agree to our
                <span class="p_c">Privacy Policy</span> &
                <span class="p_c">Cookie Policy</span>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
